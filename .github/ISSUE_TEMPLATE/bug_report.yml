name: Bug report
description: Report a reproducible problem in the frontend or contracts
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include private keys, wallet seeds, API tokens, or unredacted user data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the route, chain, contract call, or UI actions as relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, commit, and network (for example Mezo Testnet).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact addresses or data if needed; never include credentials.
    validations:
      required: false
